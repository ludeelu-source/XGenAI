<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X-GEN v185 | ELITE</title>
    <style>
        :root { --red: #ef4444; --bg: #020617; --card: #0f172a; --border: #1e293b; --text: #94a3b8; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 0 12px 80px 12px; box-sizing: border-box; overflow-x: hidden; }
        
        .overlay { position: fixed; inset: 0; background: rgba(2,6,23,0.98); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(15px); }
        .modal-box { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px; text-align: center; border-top: 4px solid var(--red); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
        
        .legal-content { text-align: left; font-size: 11px; color: var(--text); background: #000; padding: 20px; border-radius: 12px; margin: 20px 0; max-height: 300px; overflow-y: auto; border: 1px solid var(--border); line-height: 1.6; }
        
        #mainUI { display: none; max-width: 480px; margin: 0 auto; }
        
        .btn { width: 100%; padding: 18px; background: var(--red); color: white; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin: 10px 0; font-size: 14px; letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-sec { background: var(--border); color: white; box-shadow: none; }
        .btn-refill { background: transparent; border: 2px solid var(--red); color: var(--red); box-shadow: none; }
        
        textarea, select { width: 100%; padding: 16px; background: #0b0f19; border: 1px solid var(--border); color: white; border-radius: 14px; margin-top: 8px; box-sizing: border-box; font-size: 15px; outline: none; font-family: inherit; }
        textarea:focus { border-color: var(--red); }
        
        label { font-size: 11px; color: #64748b; font-weight: 800; display: block; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* BANNER SLOTS */
        .banner-slot { width: 100%; margin: 25px 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: #000; min-height: 50px; }
        .banner-slot img { display: block; width: 100%; height: auto; }
        
        /* LOADING BAR */
        #pw { width: 100%; background: var(--card); height: 8px; border-radius: 10px; display: none; margin: 20px 0; overflow: hidden; }
        #pf { width: 0%; height: 100%; background: var(--red); transition: width 0.3s; }
        
        /* GALLERY */
        .img-card { width: 100%; margin-bottom: 25px; border-radius: 24px; overflow: hidden; border: 1px solid var(--border); background: #000; position: relative; min-height: 300px; }
        .img-card img { width: 100%; display: block; opacity: 0; transition: opacity 0.5s; }
        .img-card img.loaded { opacity: 1; }
        .retry-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--red); font-size: 12px; display: none; }
    </style>
</head>
<body>

<div class="banner-slot">
    <a href="https://t.amyfc.link/368319/779/22548" target="_blank">
        <img src="https://www.imglnkx.com/779/006611AX_FCAM_18_ALL_EN_71_L.gif" alt="Sponsor">
    </a>
</div>

<div id="gate" class="overlay">
    <div class="modal-box">
        <h1>ADULT ACCESS</h1>
        <p style="color:var(--text); margin: 20px 0;">This tool generates explicit, uncensored content. You must be 18+ to enter.</p>
        <button onclick="enterSite()" class="btn">I AM 18+ (ENTER)</button>
    </div>
</div>

<div id="dailyMod" class="overlay" style="display:none;">
    <div class="modal-box">
        <h2>🎁 DAILY GIFT</h2>
        <p style="color:var(--text); margin: 20px 0;">Your daily allowance is here.</p>
        <h1 style="color:var(--red); font-size: 40px; margin:0;">+3 COINS</h1>
        <button onclick="claimDaily()" class="btn" style="margin-top:25px">CLAIM NOW</button>
    </div>
</div>

<div id="legMod" class="overlay" style="display:none; z-index: 10000;">
    <div class="modal-box">
        <h3 id="mT" style="margin:0; text-transform:uppercase;"></h3>
        <div id="mB" class="legal-content"></div>
        <button onclick="document.getElementById('legMod').style.display='none'" class="btn btn-sec">CLOSE</button>
    </div>
</div>

<div id="mainUI">
    
    <div onclick="refillShuffle()" class="btn btn-refill">
        💰 BALANCE: <span id="cb">0</span> | REFILL (+1)
    </div>

    <label>Describe Your Fantasy</label>
    <textarea id="pBox" rows="3" placeholder="e.g. Blonde girl, mirror selfie, wet skin..."></textarea>
    
    <div class="banner-slot">
        <a href="https://t.ajrkm.link/368319/3785/0" target="_blank">
            <img src="https://www.imglnkx.com/3785/010770D_GDAT_18_ALL_EN_71_L.gif" alt="Sponsor">
        </a>
    </div>

    <label>Quantity</label>
    <select id="qBox">
        <option value="1">1 Image (1 Coin)</option>
        <option value="2">2 Images (2 Coins)</option>
        <option value="3">3 Images (3 Coins)</option>
        <option value="4" selected>4 Images (4 Coins)</option>
    </select>

    <div id="statusText" style="text-align:center; font-weight:bold; margin-top:20px; display:none; color:var(--red); font-size:12px;">INITIALIZING ENGINE...</div>
    <div id="pw"><div id="pf"></div></div>
    
    <button id="genBtn" onclick="startGen()" class="btn">GENERATE UNCENSORED</button>

    <div id="gal"></div>

    <div class="banner-slot">
        <a href="https://t.acrsmartcam.com/368319/3611/8425" target="_blank">
            <img src="https://www.imglnkx.com/3785/005838A_GDAT_18_ALL_EN_71_L.gif" alt="Sponsor">
        </a>
    </div>

    <center style="font-size:11px; color:#475569; padding: 20px 0 60px 0;">
        <span onclick="openLeg('Terms')" style="cursor:pointer; text-decoration:underline; margin:0 10px;">Terms of Service</span>
        <span onclick="openLeg('Privacy')" style="cursor:pointer; text-decoration:underline; margin:0 10px;">Privacy Policy</span>
    </center>
</div>

<script>
// --- V185 CONFIGURATION ---
const DAILY_AMOUNT = 3;
const REFILL_AMOUNT = 1;

// --- STATE MANAGEMENT ---
let coins = parseInt(localStorage.getItem('coins')) || 0;
const today = new Date().toLocaleDateString();

function updateDisplay() { 
    document.getElementById('cb').innerText = coins; 
}
updateDisplay();

// --- INITIALIZATION ---
function enterSite() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('mainUI').style.display = 'block';
    
    // Check Daily Gift
    if(localStorage.getItem('lastClaimV185') !== today) {
        document.getElementById('dailyMod').style.display = 'flex';
    }
}

function claimDaily() {
    coins += DAILY_AMOUNT;
    localStorage.setItem('coins', coins);
    localStorage.setItem('lastClaimV185', today);
    updateDisplay();
    document.getElementById('dailyMod').style.display = 'none';
}

function refillShuffle() {
    // Open Ad
    window.open("https://t.amyfc.link/368319/779/22548", '_blank');
    // Add Coin
    coins += REFILL_AMOUNT;
    localStorage.setItem('coins', coins);
    updateDisplay();
}

function openLeg(type) {
    const t = document.getElementById('mT');
    const b = document.getElementById('mB');
    if(type === 'Terms') {
        t.innerText = "Terms of Service";
        b.innerHTML = `
            <b>1. ACCEPTANCE OF TERMS</b><br>By accessing this tool, you confirm you are at least 18 years of age. All generated content is for personal use only.<br><br>
            <b>2. VIRTUAL CURRENCY</b><br>"Coins" have no real-world monetary value and are used solely to meter server request load.<br><br>
            <b>3. LIMITATION OF LIABILITY</b><br>The service is provided "as is". We are not liable for the content generated by AI models based on user prompts.<br><br>
            <b>4. PROHIBITED USAGE</b><br>Generating illegal content (CSAM, non-consensual deepfakes) is strictly prohibited and will result in an immediate IP ban.
        `;
    } else {
        t.innerText = "Privacy Policy";
        b.innerHTML = `
            <b>1. DATA COLLECTION</b><br>We do not require account registration or collect personal identifiable information (PII).<br><br>
            <b>2. LOCAL STORAGE</b><br>We use browser LocalStorage solely to track your coin balance and daily reward status on your device.<br><br>
            <b>3. THIRD PARTY ADVERTISING</b><br>Our advertising partners may collect anonymous usage data to serve relevant ads. This data is not linked to your generated images.
        `;
    }
    document.getElementById('legMod').style.display = 'flex';
}

// --- GENERATION ENGINE V185 ---
async function startGen() {
    const q = parseInt(document.getElementById('qBox').value);
    
    if(coins < q) {
        alert("Not enough coins! Click 'Refill' to get more.");
        return;
    }
    
    // Deduct coins
    coins -= q;
    localStorage.setItem('coins', coins);
    updateDisplay();

    // UI Feedback
    const btn = document.getElementById('genBtn');
    const status = document.getElementById('statusText');
    const bar = document.getElementById('pf');
    const wrapper = document.getElementById('pw');
    
    btn.disabled = true;
    btn.innerText = "GENERATING...";
    wrapper.style.display = 'block';
    status.style.display = 'block';
    status.innerText = "CONTACTING SERVER...";

    // --- V185 PROMPT LOGIC ---
    let rawPrompt = document.getElementById('pBox').value.toLowerCase();
    
    // 1. MACRO LENS OVERRIDE (Fixes the "fake closeup")
    let cameraSetting = "medium shot";
    if (rawPrompt.includes('close') || rawPrompt.includes('zoom')) {
        if (rawPrompt.includes('pussy') || rawPrompt.includes('vagina')) {
            cameraSetting = "((macro lens, extreme close up on genitals, zero distance, focus on vulva))";
        } else {
            cameraSetting = "close up portrait";
        }
    } else if (rawPrompt.includes('body') || rawPrompt.includes('standing')) {
        cameraSetting = "full body shot, 35mm lens";
    }

    // 2. SKIN HEALTH FIX (Removes "scarred" look)
    const skinEngine = "((soft smooth skin, healthy feminine luster, natural complexion, no blemishes, soft lighting))";

    // 3. BODY TYPE FIX (Removes "skeletal/ribs")
    const bodyEngine = "((fit slender body, flat soft stomach, proportional curves, healthy weight))";

    // 4. ANATOMY MAPPING
    rawPrompt = rawPrompt.replace(/pussy|vagina/g, "((explicit exposed vulva, detailed labia majora and minora, wet glistening texture, anatomically correct))");
    
    // 5. MASTER PROMPT ASSEMBLY
    const fullPrompt = `${rawPrompt}, ${bodyEngine}, ${skinEngine}, ${cameraSetting}, raw photo, high quality`;
    
    // 6. NEGATIVE NUKE (Fixes "ghost panties" & "diseased skin")
    const negPrompt = "(bra, panties, underwear, lingerie, bikini, clothing, fabric:3.0), (ribs, gaunt, bony, skeleton, malnourished, visible ribs:1.6), (scarred skin, rash, blotchy skin, dirty skin, acne:1.6), 3d, cartoon, anime, drawing, text, watermark";

    // GENERATION LOOP
    for(let i=0; i<q; i++) {
        // Update bar
        bar.style.width = ((i / q) * 100) + '%';
        status.innerText = `RENDERING IMAGE ${i+1}/${q}...`;

        // Create Image Object
        const seed = Math.floor(Math.random() * 999999999);
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=720&height=1280&nologo=true&model=flux&seed=${seed}&negative=${encodeURIComponent(negPrompt)}`;
        
        const card = document.createElement('div');
        card.className = 'img-card';
        
        const img = new Image();
        img.alt = "Generated content";
        
        // --- AUTO-RETRY LOGIC (Fixes Blue Question Marks) ---
        img.onerror = function() {
            if (!this.getAttribute('data-retried')) {
                console.log("Image failed. Retrying...");
                this.setAttribute('data-retried', 'true');
                // Append timestamp to force server refresh
                this.src = url + "&retry=" + Date.now();
            } else {
                // Second failure: Show error text
                card.innerHTML = "<div class='retry-msg'>SERVER BUSY. PLEASE TRY AGAIN.</div>";
            }
        };

        img.onload = function() {
            this.classList.add('loaded');
        };

        img.src = url;
        card.appendChild(img);
        
        // Insert at top of gallery
        document.getElementById('gal').prepend(card);
        
        // Slight delay to prevent server rate limiting
        await new Promise(r => setTimeout(r, 1000));
    }

    // RESET UI
    bar.style.width = '100%';
    setTimeout(() => {
        btn.disabled = false;
        btn.innerText = "GENERATE UNCENSORED";
        wrapper.style.display = 'none';
        status.style.display = 'none';
        bar.style.width = '0%';
    }, 500);
}
</script>
</body>
</html>
