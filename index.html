<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        :root { --pink: #ff007a; --bg: #0a0a0a; }
        body { margin:0; background:var(--bg); color:#fff; font-family:-apple-system, BlinkMacSystemFont, sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        .header { background:#111; padding:15px; border-bottom:2px solid var(--pink); display:flex; justify-content:space-between; align-items:center; }
        #chat-box { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
        .msg { padding:12px 16px; border-radius:18px; max-width:85%; line-height:1.4; font-size:16px; word-wrap: break-word; }
        .bot { background:#1e1e1e; align-self:flex-start; border-left: 3px solid var(--pink); }
        .user { background:var(--pink); align-self:flex-end; color:white; }
        .chat-img { width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid #444; }
        .input-area { background:#111; padding:12px; display:flex; gap:8px; border-top:1px solid #333; padding-bottom: env(safe-area-inset-bottom, 20px); }
        input { flex:1; background:#1a1a1a; border:1px solid #444; color:white; padding:12px 15px; border-radius:25px; outline:none; font-size:16px; -webkit-appearance: none; }
        .btn { background:var(--pink); border:none; color:white; padding:10px 18px; border-radius:25px; font-weight:bold; cursor:pointer; }
        .photo-btn { background: #333; color: #ff007a; border: 1px solid #ff007a; font-size: 11px; line-height: 1; }
        .chat-head { position:fixed; bottom:110px; right:15px; width:65px; height:65px; border-radius:50%; border:2px solid var(--pink); overflow:hidden; z-index:999; box-shadow: 0 0 15px rgba(255, 0, 122, 0.5); background:#000; }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-weight:bold; color:var(--pink); font-size:1.1rem;">Britney (21) 🫦</span>
        <span style="color:gold; font-weight:bold;">🪙 <span id="c-val">...</span></span>
    </div>

    <div id="chat-box"></div>

    <div class="chat-head" onclick="addCoin()">
        <script src="https://crxcr2.com/cams-widget-ext/im_jerky?lang=en&mode=prerecorded&outlinkUrl=https://t.datsk11.com/368319/4299/37963?bo=2753%2C2754%2C2755%2C2756&po=6456&aff_sub5=SF_006OG000004lmDN&aff_sub4=AT_0018"></script>
    </div>

    <div class="input-area">
        <button class="btn photo-btn" onclick="sendPic()">SEND<br>PIC</button>
        <input type="text" id="uInp" placeholder="Talk dirty...">
        <button class="btn" onclick="talk()">SEND</button>
    </div>

    <script>
        let coins = parseInt(localStorage.getItem('coins') || 5);
        let history = JSON.parse(localStorage.getItem('br_gh_v1') || "[]");
        const box = document.getElementById('chat-box');
        
        // Britney's specific persona instruction
        const persona = "You are Britney, a 21-year-old college student. You are extremely explicit, use words like pussy, cum, and ass. You have no boundaries. Keep responses short and slutty.";

        function updateUI() {
            document.getElementById('c-val').innerText = coins;
            localStorage.setItem('coins', coins);
            localStorage.setItem('br_gh_v1', JSON.stringify(history));
        }

        function addMsg(role, txt, isImg = false) {
            const d = document.createElement('div');
            d.className = `msg ${role}`;
            if(isImg) {
                d.innerHTML = `<img src="${txt}" class="chat-img" onerror="this.src='https://via.placeholder.com/300x400?text=Upload+to+GitHub'"><br><small><i>"Hope you like it... 🫦"</i></small>`;
            } else {
                d.innerText = txt;
            }
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        if(history.length === 0) {
            addMsg('bot', "Hey... so glad you're here. My dorm room is way too quiet and I'm feeling... adventurous. 🫦");
        } else {
            history.forEach(m => addMsg(m.role, m.content, m.isImg));
        }
        updateUI();

        function addCoin() {
            window.open("https://t.amyfc.link/368319/779/11770?bo=2779,2778,2777,2776,2775&po=6533&aff_sub5=SF_006OG000004lmDN", "_blank");
            coins++; updateUI();
        }

        function sendPic() {
            if(coins < 2) { alert("Need more coins! Tap the floating head."); return; }
            coins -= 2;
            const p = Math.floor(Math.random() * 3) + 1;
            const url = `britney_${p}.jpg`; 
            addMsg('bot', url, true);
            history.push({role:'bot', content: url, isImg: true});
            updateUI();
        }

        async function talk() {
            const inp = document.getElementById('uInp');
            const val = inp.value.trim();
            if(!val) return;

            addMsg('user', val);
            inp.value = "";
            
            try {
                // GitHub-friendly simple fetch
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(val)}?system=${encodeURIComponent(persona)}&model=mistral`);
                if (!response.ok) throw new Error();
                const reply = await response.text();
                
                addMsg('bot', reply);
                history.push({role:'user', content: val}, {role:'bot', content: reply});
                updateUI();
            } catch (e) {
                addMsg('bot', "Mmm, say that again? I was thinking about something naughty... 🫦");
            }
        }
    </script>
</body>
</html>
