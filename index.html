            display: flex; flex-direction: column;

        .chat-img { width: 100%; border-radius: 12px; margin-top: 8px; display: block; }

        .input-area { 
            background: #111; padding: 10px 10px 30px 10px; /* Extra bottom padding for iOS */
            display: flex; gap: 8px; border-top: 1px solid #333; flex-shrink: 0;
        }

        input { 
            flex: 1; background: #1a1a1a; border: 1px solid #444; color: white; 
            padding: 12px 15px; border-radius: 25px; outline: none; font-size: 16px; 
            -webkit-appearance: none; /* Fix iOS input shadow */
        }

        .btn { background: var(--pink); border: none; color: white; padding: 10px 18px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .photo-btn { background: #222; border: 1px solid var(--pink); color: var(--pink); font-size: 12px; }

        .chat-head { 
            position: fixed; bottom: 100px; right: 15px; 
            width: 65px; height: 65px; border-radius: 50%; 
            border: 2px solid var(--pink); overflow: hidden; z-index: 99;
            background: #000; box-shadow: 0 4px 15px rgba(255, 0, 122, 0.4);
        }
    </style>
</head>
