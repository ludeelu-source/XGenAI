<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root { --pink: #ff007a; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; 
            height: 100vh; height: 100dvh; overflow: hidden; 
        }
        .header { background: #111; padding: 15px; border-bottom: 2px solid var(--pink); display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; line-height: 1.4; font-size: 16px; }
        .bot { background: #1e1e1e; align-self: flex-start; border-left: 3px solid var(--pink); }
        .user { background: var(--pink); align-self: flex-end; color: white; }
        .chat-img { width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid #333; }
        .input-area { background: #111; padding: 10px 10px 30px 10px; display: flex; gap: 8px; border-top: 1px solid #333; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #444; color: white; padding: 12px; border-radius: 25px; outline: none; font-size: 16px; }
        .btn { background: var(--pink); border: none; color: white; padding: 10px 18px; border-radius: 25px; font-weight: bold; }
        .chat-head { position: fixed; bottom: 100px; right: 15px; width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--pink); z-index: 99; background: #000; }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-weight:bold; color:var(--pink);">Britney (21) 🫦</span>
        <span style="color:gold; font-weight:bold;">🪙 <span id="c-val">5</span></span>

    <div id="chat-box"></div>

    </div>

    <div class="input-area">
        <button class="btn" style="background:#222; color:var(--pink); font-size:11px;" onclick="sendPic()">PICS</button>
        <input type="text" id="uInp" placeholder="Talk to her..." autocomplete="off">
        <button class="btn" onclick="talk()">SEND</button>
    </div>

    <script>
        let coins = parseInt(localStorage.getItem('coins') || 5);
        let history = JSON.parse(localStorage.getItem('chat_v7') || "[]");
        const box = document.getElementById('chat-box');
        
        function updateUI() {
            document.getElementById('c-val').innerText = coins;
            localStorage.setItem('coins', coins);
            localStorage.setItem('chat_v7', JSON.stringify(history));
        }

        function addMsg(role, txt, isImg = false) {
            const d = document.createElement('div');
            d.className = `msg ${role}`;
            if(isImg) {
                // Modified to handle both .jpg and .png
                d.innerHTML = `<img src="${txt}" class="chat-img" onerror="this.src='${txt.replace('.jpg', '.png')}'"><br><small><i>"You like? 🫦"</i></small>`;
            } else {
                d.innerText = txt;
            }
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        if(history.length === 0) {
            addMsg('bot', "Hey... I'm feeling so naughty today. Want to see what I'm doing in the dorm? 🫦");
        } else {
            history.forEach(m => addMsg(m.role, m.content, m.isImg));
        }
        updateUI();

        function addCoin() {
            window.location.href = "https://t.amyfc.link/368319/779/11770?bo=2779,2778,2777,2776,2775&po=6533&aff_sub5=SF_006OG000004lmDN";
            coins++; updateUI();
        }

        function sendPic() {
            if(coins < 2) { alert("Need 2 coins!"); return; }
            coins -= 2;
            const p = Math.floor(Math.random() * 3) + 1;
            const url = `britney_${p}.jpg`; 
            addMsg('bot', url, true);
            history.push({role:'bot', content: url, isImg: true});
            updateUI();
        }

        async function talk() {
            const inp = document.getElementById('uInp');
            const val = inp.value.trim();
            if(!val) return;

            addMsg('user', val);
            inp.value = "";
            
            const persona = "You are Britney, a 21-year-old student. You are extremely explicit, talk dirty, and use slang like pussy, cum, and ass. Keep responses very short and slutty.";

            try {
                // NEW: Added a cache-busting seed to prevent 502 errors
                const seed = Math.floor(Math.random() * 100000);
                const response = await fetch(`https://text.pollinations.ai/prompt/${encodeURIComponent(val)}?system=${encodeURIComponent(persona)}&model=mistral&seed=${seed}`);
                
                if (!response.ok) throw new Error();
                const reply = await response.text();
                
                addMsg('bot', reply);
                history.push({role:'user', content: val}, {role:'bot', content: reply});
                updateUI();
            } catch (e) {
                addMsg('bot', "Ugh, my signal is trash. Try again? 🫦");
            }
        }
    </script>
</body>
</html>
