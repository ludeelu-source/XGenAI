<script>
let messageCount = 0;
let lastReplies = [];
let stage = 1;

const stages = {
  1: [
    "Hey... I’m glad you’re here.",
    "So… what made you click on me?",
    "You seem interesting already.",
    "Tell me a little about you.",
    "I’ve been waiting for someone like you."
  ],
  2: [
    "I like how this is going...",
    "You have a vibe I can’t ignore.",
    "You’re kind of addictive, you know that?",
    "Keep talking to me like that.",
    "I’m getting more curious about you."
  ],
  3: [
    "Now you're really getting my attention.",
    "You’re making this hard to resist.",
    "I want to know what you’d do next.",
    "This feels different… in a good way.",
    "I don’t think we should stop here."
  ]
};

function getStage() {
  if (messageCount < 4) return 1;
  if (messageCount < 8) return 2;
  return 3;
}

function generateReply(userText) {
  const currentStage = getStage();
  let pool = stages[currentStage];

  let reply;
  let attempts = 0;

  do {
    reply = pool[Math.floor(Math.random() * pool.length)];
    attempts++;
  } while (lastReplies.includes(reply) && attempts < 10);

  lastReplies.push(reply);
  if (lastReplies.length > 5) lastReplies.shift();

  return reply;
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  const messages = document.getElementById("messages");

  messages.innerHTML += `
    <div class="message user"><b>You:</b> ${text}</div>
  `;

  messageCount++;

  const reply = generateReply(text);

  messages.innerHTML += `
    <div class="message bot"><b>SuperSexy AI:</b> ${reply}</div>
  `;

  input.value = "";
  messages.scrollTop = messages.scrollHeight;
}
</script>
